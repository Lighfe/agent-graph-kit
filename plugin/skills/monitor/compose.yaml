# The optional monitoring stack of the monitor skill: OTel Collector, Prometheus, Loki, Grafana.
# Start and stop it with `board.py up` and `board.py down`; board.py sets the AGK_* variables below.
# Every port is published on 127.0.0.1 only, and nothing restarts on boot or after a crash.
# No container gets a GitHub, Claude or Codex credential.
# Spec: docs/specs/2026-11-13-otel-monitoring-boards.md, Part B
name: agk-monitor

services:
  collector:
    image: otel/opentelemetry-collector-contrib:0.161.0  # pushed 2026-09-16
    restart: "no"
    command:
      - --config=/etc/otelcol/collector.yaml
    ports:
      - "127.0.0.1:${AGK_OTLP_GRPC_PORT:-4317}:4317"
      - "127.0.0.1:${AGK_OTLP_HTTP_PORT:-4318}:4318"
    environment:
      # A regular expression of the projects in monitor-projects.json (made by board.py up).
      # The Collector drops data of any other project, and data with no agk.project.
      AGK_PROJECT_PATTERN: "${AGK_PROJECT_PATTERN:?run board.py up}"
      AGK_PROMETHEUS_WRITE_URL: "${AGK_PROMETHEUS_WRITE_URL:-http://prometheus:9090/api/v1/write}"
      AGK_LOKI_OTLP_URL: "${AGK_LOKI_OTLP_URL:-http://loki:3100/otlp}"
    volumes:
      - type: bind
        source: ./otel/collector.yaml
        target: /etc/otelcol/collector.yaml
        read_only: true
    depends_on:
      - prometheus
      - loki

  prometheus:
    image: prom/prometheus:v3.15.0  # pushed 2026-09-25
    restart: "no"
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=365d
      - --web.enable-remote-write-receiver
    ports:
      - "127.0.0.1:${AGK_PROMETHEUS_PORT:-9090}:9090"
    # The host process facts.py (issue #310) is scraped on the host. `board.py up` sets AGK_FACTS_HOST to
    # the gateway of this compose network (the address facts.py listens on); the name below is the fallback.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    configs:
      - source: facts_targets
        target: /etc/prometheus/targets/facts.json
    volumes:
      - type: bind
        source: ./otel/prometheus.yml
        target: /etc/prometheus/prometheus.yml
        read_only: true
      - type: bind
        source: ./otel/rules
        target: /etc/prometheus/rules
        read_only: true
      - type: volume
        source: prometheus-data
        target: /prometheus

  loki:
    image: grafana/loki:3.7.8  # pushed 2026-09-17
    restart: "no"
    command:
      - -config.file=/etc/loki/loki.yaml
    ports:
      - "127.0.0.1:${AGK_LOKI_PORT:-3100}:3100"
    volumes:
      - type: bind
        source: ./otel/loki.yaml
        target: /etc/loki/loki.yaml
        read_only: true
      - type: volume
        source: loki-data
        target: /loki

  grafana:
    image: grafana/grafana:13.2.4  # pushed 2026-10-13
    restart: "no"
    # The password file is mode 0600 for the host user, so Grafana runs with the host uid/gid.
    user: "${AGK_UID:?run board.py up}:${AGK_GID:?run board.py up}"
    ports:
      - "127.0.0.1:${AGK_GRAFANA_PORT:-3000}:3000"
    environment:
      GF_PLUGINS_PREINSTALL_AUTO_UPDATE: "false"
      # Grafana 13 downloads the app plugins below on each new plugin folder, and it starts a
      # backend process (about 25 MB each) for each bundled data source. The boards need only
      # Prometheus and Loki, so all others are off. No community plugin is installed.
      GF_PLUGINS_DISABLE_PLUGINS: "grafana-advisor-app,grafana-exploretraces-app,grafana-lokiexplore-app,grafana-metricsdrilldown-app,grafana-pyroscope-app,elasticsearch,grafana-postgresql-datasource,grafana-pyroscope-datasource,influxdb,jaeger,mssql,mysql,opentsdb,stackdriver,tempo,zipkin,grafana-azure-monitor-datasource,cloudwatch,grafana-testdata-datasource,parca"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_AUTH_DISABLE_LOGIN_FORM: "false"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SECURITY_ADMIN_USER: "admin"
      GF_SECURITY_ADMIN_PASSWORD__FILE: "/run/secrets/grafana_admin"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
      # A lower GC target for Grafana's Go runtime keeps its RAM small. No GOMEMLIMIT and no
      # container memory cap: a heap limit made Grafana run its GC all the time, and a cap would kill it.
      GOGC: "10"
      # Grafana's own db and logs live in the container, as the host uid cannot write the image folders.
      GF_PATHS_DATA: "/tmp/grafana-data"
      GF_PATHS_LOGS: "/tmp/grafana-log"
      GF_PATHS_PLUGINS: "/tmp/grafana-plugins"
      # The addresses of the data sources are settings, so the stack can run elsewhere later.
      AGK_PROMETHEUS_URL: "${AGK_PROMETHEUS_URL:-http://prometheus:9090}"
      AGK_LOKI_URL: "${AGK_LOKI_URL:-http://loki:3100}"
    secrets:
      - grafana_admin
    volumes:
      - type: bind
        source: ./grafana/provisioning
        target: /etc/grafana/provisioning
        read_only: true
      - type: bind
        source: ./grafana/boards
        target: /var/lib/agk-boards
        read_only: true
    depends_on:
      - prometheus
      - loki

configs:
  # The target list of the scrape job `facts`; the port is a setting.
  facts_targets:
    content: '[{"targets": ["${AGK_FACTS_HOST:-host.docker.internal}:${AGK_FACTS_PORT:-9464}"]}]'

secrets:
  grafana_admin:
    file: "${AGK_GRAFANA_ADMIN_FILE:?run board.py up}"

volumes:
  prometheus-data:
  loki-data:

# The two data sources of the monitor stack: Prometheus (metrics) and Loki (logs).
# The addresses come from the Grafana environment (compose.yaml), so they are settings.
apiVersion: 1
datasources:
  - name: prometheus
    uid: agk-prometheus
    type: prometheus
    access: proxy
    url: ${AGK_PROMETHEUS_URL}
    isDefault: true
    editable: false
  - name: loki
    uid: agk-loki
    type: loki
    access: proxy
    url: ${AGK_LOKI_URL}
    editable: false

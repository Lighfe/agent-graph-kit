# Prometheus of the monitor stack. The Collector writes the OTel metrics to it (remote write).
# It scrapes the host process facts.py (issue #310); the target list is the config `facts_targets`
# of compose.yaml. Rule files: otel/rules/ (empty until the recording rules of issue #312).
global:
  scrape_interval: 30s
  evaluation_interval: 30s

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  - job_name: facts
    file_sd_configs:
      - files:
          - /etc/prometheus/targets/facts.json

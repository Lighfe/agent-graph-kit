# Recording rules of the monitor stack (issue #312): the tokens and the active seconds of the last
# minute, with project, stage, issue, role and launch. Spec: docs/specs/2026-11-13-otel-monitoring-boards.md,
# "Definitions". The test file is agk_test.yaml (the extension .yaml keeps the *.yml rule glob of
# prometheus.yml from loading it as a rule file).
#
# Prometheus names after the Collector (found by a live run of the pinned Collector image
# otel/opentelemetry-collector-contrib:0.161.0 with the delta_to_cumulative processor and resource
# attributes as labels, fed synthetic OTLP; no live data of a real Claude Code or Codex session was
# available). Rule: dots become underscores, the unit is added as a suffix, a counter gets _total.
#   claude_code.token.usage         -> claude_code_token_usage_tokens_total
#                                      labels agk_project, model, query_source, agent_name, type
#   claude_code.active_time.total   -> claude_code_active_time_seconds_total
#                                      labels agk_project, type, query_source, agent_name
#   codex.turn.token_usage          -> codex_turn_token_usage_sum (histogram sum), label token_type
#                                      (input, cached_input, output); no unit, so no unit suffix
#   codex.api_request.duration_ms   -> codex_api_request_duration_ms_milliseconds_sum when Codex
#                                      sets the unit ms, else codex_api_request_duration_ms_sum
#   codex.tool.call.duration_ms     -> codex_tool_call_duration_ms_milliseconds_sum, or
#                                      codex_tool_call_duration_ms_sum (the rules accept both)
#   agk_marker{agk_project, stage, issue, role, launch}   (facts.py, issue #310)
#
# How the last minute is taken: a delta counter becomes a cumulative series, with one sample for each
# export (60 s). A 1 m increase() window then holds one sample and gives no result. So each rule
# takes the cumulative value now minus the last value at or before one minute ago, which is
# exactly the data of the minute. A series without an earlier value (first export) counts in full.
#
# Roles: query_source main is the orchestrator; agent_name pm, software-engineer and
# frontend-engineer (engineer), qa-engineer (qa-claude), planner; any other subagent is other;
# Codex is qa-codex. An optional plugin prefix of the agent name (agk:pm) is accepted.
# Codex input counts its cached input; the rules subtract it, the cached part is cache_read.
# stage, issue and launch come from agk_marker of the same agk_project; without a marker they are empty.
# Active time: the seconds of a subagent or Codex count to their role; the orchestrator keeps
# max(0, orchestrator - sum of the others); the sum over all roles of a project is scaled down to
# at most 60 s.
